name: Build Mod

on:
  push:
    branches: [ main, arena/a8432e17-necroreject ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.10.2

      - name: Build jar (desktop)
        run: |
          set +e
          gradle jar --stacktrace --no-daemon 2>&1 | tee build.log
          EXIT=${PIPESTATUS[0]}
          echo "=== Last 200 lines of build log ==="
          tail -200 build.log
          exit $EXIT

      - name: List build outputs
        if: always()
        run: ls -la build/libs/ 2>&1 || echo "No libs yet"

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
          if-no-files-found: ignore

      - name: Upload mod jar artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: necroreject-desktop
          path: build/libs/necrorejectDesktop.jar

      - name: Create release (tagged pushes)
        if: success() && startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: build/libs/necrorejectDesktop.jar
