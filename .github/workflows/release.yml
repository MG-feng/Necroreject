name: Release Mod

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag name for the release (e.g. v0.1.0-dev.7)'
        required: true

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.5

      - name: Build jar (desktop)
        run: gradle jar --stacktrace --no-daemon --console=plain

      - name: Compute SHA-256
        id: hash
        run: |
          cd build/libs
          HASH=$(sha256sum necrorejectDesktop.jar | awk '{print $1}')
          echo "sha256=$HASH" >> $GITHUB_OUTPUT
          echo "SHA-256: $HASH"

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          name: Necroreject ${{ github.event.inputs.tag || github.ref_name }}
          body: |
            ## Necroreject ${{ github.event.inputs.tag || github.ref_name }}

            Desktop build of the mod. Drop `necrorejectDesktop.jar` into your `%AppData%/Mindustry/mods/` folder.

            **SHA-256** (`necrorejectDesktop.jar`):
            ```
            ${{ steps.hash.outputs.sha256 }}
            ```

            ### Windows SmartScreen / Chrome warning
            This jar is **not signed** with a paid code-signing certificate (those cost several hundred USD/year).
            Chrome/Edge/SmartScreen will show "This file is not commonly downloaded" or "Unknown publisher" on **first download**
            until enough people have downloaded it. This is normal for unsigned indie mod jars — it does **not** mean there is a virus.
            To keep it: click the arrow next to "Discard" / "删除" in the download bar, then "Keep" / "保留" / "仍要保留".

            You can verify the file integrity by comparing its SHA-256 against the hash above:
            ```
            certutil -hashfile necrorejectDesktop.jar SHA256
            ```
          files: build/libs/necrorejectDesktop.jar
          draft: false
          prerelease: true
