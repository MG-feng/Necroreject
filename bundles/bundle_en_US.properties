unit.necroreject-necroflux.name=Necroflux
unit.necroreject-necroflux.description=A small steel-boned walker fused with blood-red grub tissue. It spits straight corrosive phlegm and continuously secretes fungal puddles.

unit.necroreject-corrocrust.name=Corrocrust
unit.necroreject-corrocrust.description=A heavily armored variant of the Necroflux. It does not spit phlegm, but secretes more fungal puddles and projects a fungal aura that corrodes enemies and heals allied fungal units.

unit.necroreject-ruptgout.name=Ruptgout
unit.necroreject-ruptgout.description=A heavy quadruped. It charges and lobs medium phlegm shells that can be shot down in flight. On death, it bursts and sprays fungal puddles.

unit.necroreject-skysunder.name=Skysunder
unit.necroreject-skysunder.description=A heavy eight-legged unit with a giant steel cannon mounted on its flesh. It lobs massive phlegm shells from long range, dealing heavy damage, corrosion, and spawning Necrofluxes on impact. On death, it explodes violently and spawns offspring.

unit.necroreject-rendcrown.name=Rendcrown
unit.necroreject-rendcrown.description=A massive crawling infectant. It projects a corrosion field and continuously secretes fungal puddles. On death, it bursts violently, spawning Ruptgouts, Corrocrusts, and many Necrofluxes.

status.necroreject-necro-corrosion.name=Fungal Corrosion
status.necroreject-necro-corrosion.description=Corroded by fungal puddles. Continuously loses max health, moves slower, and becomes more flammable.

status.necroreject-necro-rooted.name=Rooted
status.necroreject-necro-rooted.description=Pinned down by fungal mass. Cannot move.
