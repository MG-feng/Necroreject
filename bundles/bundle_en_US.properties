unit.necroreject-necroflux.name=Necroflux
unit.necroreject-necroflux.description=Light steel-boned fungal walker. Spits short-range corrosive phlegm and continuously leaves thin fungal puddles under its feet.

weapon.necroreject-necro-spit.name=Corrosive Spit
weapon.necroreject-necro-spit.description=Fires a glob of fungal phlegm in a straight line. On impact it splashes small puddles and briefly applies Fungal Corrosion.
weapon.necroreject-necro-secretion.name=Secretion
weapon.necroreject-necro-secretion.description=Passively drips fungal fluid under the unit; the puddles it leaves slowly heal nearby fungal units and harm enemies.

unit.necroreject-corrocrust.name=Corrocrust
unit.necroreject-corrocrust.description=Heavily armored fungal walker. Does not spit phlegm, but secretes extra fluid and projects a short fungal aura that corrodes enemies and heals nearby fungal allies.

weapon.necroreject-corro-secretion.name=Thick Secretion
weapon.necroreject-corro-secretion.description=Drips thick fungal puddles at a higher rate than Necroflux.
weapon.necroreject-corro-aura.name=Corrosion Aura
weapon.necroreject-corro-aura.description=A pulsating aura around the unit. Enemies inside take continuous piercing damage and become corroded; allied fungal units are slowly healed.

unit.necroreject-ruptgout.name=Ruptgout
unit.necroreject-ruptgout.description=Heavy four-legged artillery. Charges up Lobbing arc phlegm shells that can be shot down mid-flight. Bursts in a shower of fungal fluid on death.

weapon.necroreject-rupt-lob.name=Phlegm Mortar
weapon.necroreject-rupt-lob.description=Lobs an arc phlegm shell that travels over walls. On impact it deals heavy splash damage, leaves wide puddles and briefly roots the shooter in place while charging.
weapon.necroreject-rupt-secretion.name=Secretion
weapon.necroreject-rupt-secretion.description=Passively secretes fungal puddles around its feet.
weapon.necroreject-rupt-death.name=Rupture Burst
weapon.necroreject-rupt-death.description=On death, the unit bursts in a wide fungal explosion, spraying corrosive puddles around its corpse.

unit.necroreject-skysunder.name=Skysunder
unit.necroreject-skysunder.description=Massive eight-legged siege platform carrying a bio-cannon. Fires slow, arcing giant phlegm shells that deal heavy splash damage, corrode a wide area, and spawn a handful of Necrofluxes on impact. Explodes violently and spawns fungal offspring when killed.

weapon.necroreject-sky-shell.name=Giant Phlegm Shell
weapon.necroreject-sky-shell.description=A very large, slow arcing shell that can be shot down mid-flight. Heavy splash damage at landing, large corrosive puddles and 1-2 spawned Necrofluxes. Briefly roots the Skysunder while charging.
weapon.necroreject-sky-secretion.name=Secretion
weapon.necroreject-sky-secretion.description=Constantly drips fungal fluid at the unit's base.
weapon.necroreject-sky-death-burst.name=Cataclysmic Burst
weapon.necroreject-sky-death-burst.description=On death, the bio-cannon detonates in a massive fungal explosion.
weapon.necroreject-sky-death-necroflux.name=Necroflux Spawn
weapon.necroreject-sky-death-necroflux.description=The explosion tears free a cluster of Necrofluxes.
weapon.necroreject-sky-death-corrocrust.name=Corrocrust Spawn
weapon.necroreject-sky-death-corrocrust.description=Occasionally a Corrocrust crawls out of the wreckage.

unit.necroreject-rendcrown.name=Rendcrown
unit.necroreject-rendcrown.description=Colossal crawling fungal sovereign. Projects a wide corrosion field, hurls random phlegm splatters and periodically buds a pustule that bursts into Corrocrusts. Its death bloom spawns a small army of fungal units.

weapon.necroreject-rend-field.name=Rend Field
weapon.necroreject-rend-field.description=A crown-shaped corrosion field that rapidly damages nearby enemies and regenerates fungal units inside it based on their max health.
weapon.necroreject-rend-spray.name=Phlegm Spray
weapon.necroreject-rend-spray.description=Randomly hurls globs of phlegm in all directions, each leaving a small corrosive puddle.
weapon.necroreject-rend-secretion.name=Secretion
weapon.necroreject-rend-secretion.description=Constantly secretes large fungal puddles around itself.
weapon.necroreject-rend-pustule.name=Pustule Bud
weapon.necroreject-rend-pustule.description=Periodically buds a giant pustule near the Rendcrown that bursts, dealing splash damage and spawning a small group of Corrocrusts.
weapon.necroreject-rend-death-burst.name=Rend Bloom
weapon.necroreject-rend-death-burst.description=A catastrophic explosion of fungal mass on death.
weapon.necroreject-rend-death-ruptgout.name=Ruptgout Spawn
weapon.necroreject-rend-death-ruptgout.description=A Ruptgout may emerge from the biomass.
weapon.necroreject-rend-death-corrocrust.name=Corrocrust Spawn
weapon.necroreject-rend-death-corrocrust.description=Several Corrocrusts claw their way out of the corpse.
weapon.necroreject-rend-death-necroflux.name=Necroflux Swarm
weapon.necroreject-rend-death-necroflux.description=A swarm of Necrofluxes pours out of the body.

status.necroreject-necro-corrosion.name=Fungal Corrosion
status.necroreject-necro-corrosion.description=Corroded by fungal puddles. Continuously loses max health, moves slower, and becomes more flammable.

status.necroreject-necro-rooted.name=Rooted
status.necroreject-necro-rooted.description=Pinned down by fungal mass. Cannot move.
