unit.necroreject-necroflux.name=液烂
unit.necroreject-necroflux.description=钢骨小型步行体，血红色蛀虫组织与钢铁融合。口部喷射直线腐蚀痰液，脚下持续分泌菌液。

unit.necroreject-corrocrust.name=蚀痂
unit.necroreject-corrocrust.description=液烂的重甲变种。不喷射痰液，但分泌更多菌液，并展开菌液光环，腐蚀敌人、回复同菌体。

unit.necroreject-ruptgout.name=崩疽
unit.necroreject-ruptgout.description=重型四足单位。蓄力后抛射中型痰弹，痰弹可在飞行中被击破。死亡时爆裂并喷溅菌液。

unit.necroreject-skysunder.name=溃穹
unit.necroreject-skysunder.description=重型八足单位，肉躯上架设钢铁巨炮。超远程抛射巨型痰弹，命中后造成重创、腐蚀并爆裂出液烂。死亡时剧烈爆炸并产出子代。

unit.necroreject-rendcrown.name=裂冕
unit.necroreject-rendcrown.description=巨型爬行感染体。展开腐蚀立场，持续分泌菌液。死亡时剧烈爆裂，产出崩疽、蚀痂与大量液烂。

status.necroreject-necro-corrosion.name=菌蚀
status.necroreject-necro-corrosion.description=被菌液腐蚀。持续损失最大生命值，移动速度降低，并更容易燃烧。

status.necroreject-necro-rooted.name=扎根
status.necroreject-necro-rooted.description=被菌液压住，无法移动。
