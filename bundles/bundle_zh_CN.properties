unit.necroreject-necroflux.name=液烂
unit.necroreject-necroflux.description=钢骨小型步行体。近距离直射腐蚀痰液，脚下持续分泌少量菌液。

weapon.necroreject-necro-spit.name=腐蚀吐液
weapon.necroreject-necro-spit.description=直线喷射一团菌痰，命中时产生小片溅射、小范围菌液，并短暂施加菌蚀。
weapon.necroreject-necro-secretion.name=菌液分泌
weapon.necroreject-necro-secretion.description=在脚下持续滴落菌液，形成的菌液会缓慢治疗附近的菌体单位，同时伤害敌人。

unit.necroreject-corrocrust.name=蚀痂
unit.necroreject-corrocrust.description=液烂的重甲变种。不喷射痰液，但分泌更多菌液，并展开一圈菌液光环，腐蚀敌人、回复同菌体。

weapon.necroreject-corro-secretion.name=浓液分泌
weapon.necroreject-corro-secretion.description=以更高频率滴下浓厚菌液。
weapon.necroreject-corro-aura.name=腐蚀光环
weapon.necroreject-corro-aura.description=单位周围一圈脉动光环；敌方单位持续受到穿甲伤害并被菌蚀，友方菌体缓慢回血。

unit.necroreject-ruptgout.name=崩疽
unit.necroreject-ruptgout.description=重型四足炮兵。蓄力后抛射弧射痰弹，弹体在飞行途中可被击落。死亡时爆裂并大范围喷溅菌液。

weapon.necroreject-rupt-lob.name=痰弹迫击
weapon.necroreject-rupt-lob.description=沿抛物线抛射一发痰弹，可越过墙体。命中时造成中等范围高爆伤害、大片菌液；蓄力期间自身短暂扎根无法移动。
weapon.necroreject-rupt-secretion.name=菌液分泌
weapon.necroreject-rupt-secretion.description=在脚边持续分泌菌液。
weapon.necroreject-rupt-death.name=崩裂
weapon.necroreject-rupt-death.description=死亡时剧烈爆裂，在尸体周围大范围喷溅菌液。

unit.necroreject-skysunder.name=溃穹
unit.necroreject-skysunder.description=巨型八足攻城平台，背负一门菌生巨炮。缓慢抛射弧形巨型痰弹，造成大范围高爆与腐蚀、同时在落地点裂出数只液烂。死亡时剧烈爆炸并产出子代菌体。

weapon.necroreject-sky-shell.name=巨型痰弹
weapon.necroreject-sky-shell.description=体积巨大、速度缓慢的弧射炮弹，可被拦截。落点有大范围高爆溅射、浓重腐蚀菌液，并裂出 1-2 只液烂；蓄力时自身短暂扎根。
weapon.necroreject-sky-secretion.name=菌液分泌
weapon.necroreject-sky-secretion.description=在底盘持续滴落菌液。
weapon.necroreject-sky-death-burst.name=灾裂
weapon.necroreject-sky-death-burst.description=死亡时巨炮殉爆，产生巨型菌爆。
weapon.necroreject-sky-death-necroflux.name=液烂涌出
weapon.necroreject-sky-death-necroflux.description=爆炸中裂出一队液烂。
weapon.necroreject-sky-death-corrocrust.name=蚀痂涌出
weapon.necroreject-sky-death-corrocrust.description=偶尔会有一只蚀痂从残骸中爬出。

unit.necroreject-rendcrown.name=裂冕
unit.necroreject-rendcrown.description=巨型爬行菌王。展开大范围腐蚀立场，向四周随机喷溅菌痰，并周期性酝酿脓疱，爆裂时孵化蚀痂。死亡时绽放出大量菌体军队。

weapon.necroreject-rend-field.name=裂冕领域
weapon.necroreject-rend-field.description=头顶一圈腐蚀立场，对范围内敌人造成持续穿甲伤害，并按最大生命值百分比治疗友方菌体。
weapon.necroreject-rend-spray.name=菌痰喷洒
weapon.necroreject-rend-spray.description=向四周随机喷射数枚菌痰，每枚留下一小片腐蚀菌液。
weapon.necroreject-rend-secretion.name=菌液分泌
weapon.necroreject-rend-secretion.description=持续在自身周围分泌大片菌液。
weapon.necroreject-rend-pustule.name=脓疱萌出
weapon.necroreject-rend-pustule.description=周期性在身边萌出一个巨型脓疱，延时爆裂造成溅射伤害并孵化蚀痂小队。
weapon.necroreject-rend-death-burst.name=绽放爆轰
weapon.necroreject-rend-death-burst.description=死亡时菌体急剧膨胀后爆裂，毁灭性的菌爆覆盖极大范围。
weapon.necroreject-rend-death-ruptgout.name=崩疽涌出
weapon.necroreject-rend-death-ruptgout.description=尸肉中可能钻出一只崩疽。
weapon.necroreject-rend-death-corrocrust.name=蚀痂涌出
weapon.necroreject-rend-death-corrocrust.description=数只蚀痂从尸骸中爬出。
weapon.necroreject-rend-death-necroflux.name=液烂蜂拥
weapon.necroreject-rend-death-necroflux.description=大群液烂从菌体中涌出。

status.necroreject-necro-corrosion.name=菌蚀
status.necroreject-necro-corrosion.description=被菌液腐蚀。持续损失最大生命值，移动速度降低，并更容易燃烧。

status.necroreject-necro-rooted.name=扎根
status.necroreject-necro-rooted.description=被菌液压住，无法移动。
