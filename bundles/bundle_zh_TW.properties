unit.necroreject-necroflux.name=液爛
unit.necroreject-necroflux.description=鋼骨小型步行體，血紅色蛀蟲組織與鋼鐵融合。口部噴射直線腐蝕痰液，腳下持續分泌菌液。

unit.necroreject-corrocrust.name=蝕痂
unit.necroreject-corrocrust.description=液爛的重甲變種。不噴射痰液，但分泌更多菌液，並展開菌液光環，腐蝕敵人、回覆同菌體。

unit.necroreject-ruptgout.name=崩疽
unit.necroreject-ruptgout.description=重型四足單位。蓄力後拋射中型痰彈，痰彈可在飛行中被擊破。死亡時爆裂並噴濺菌液。

unit.necroreject-skysunder.name=潰穹
unit.necroreject-skysunder.description=重型八足單位，肉軀上架設鋼鐵巨砲。超遠程拋射巨型痰彈，命中後造成重創、腐蝕並爆裂出液爛。死亡時劇烈爆炸並產出子代。

unit.necroreject-rendcrown.name=裂冕
unit.necroreject-rendcrown.description=巨型爬行感染體。展開腐蝕立場，持續分泌菌液。死亡時劇烈爆裂，產出崩疽、蝕痂與大量液爛。

status.necroreject-necro-corrosion.name=菌蝕
status.necroreject-necro-corrosion.description=被菌液腐蝕。持續損失最大生命值，移動速度降低，並更容易燃燒。

status.necroreject-necro-rooted.name=紮根
status.necroreject-necro-rooted.description=被菌液壓住，無法移動。
