unit.necroreject-necroflux.name=液爛
unit.necroreject-necroflux.description=鋼骨小型步行體。近距離直射腐蝕痰液，腳下持續分泌少量菌液。

bullet.necroreject-necro-spit.name=腐蝕吐液
bullet.necroreject-necro-spit.description=直線噴射一團菌痰，命中時產生小範圍飛濺與菌液，並短暫施加菌蝕。
bullet.necroreject-necro-secretion.name=菌液分泌
bullet.necroreject-necro-secretion.description=在腳下持續滴落菌液；形成的菌液會緩慢治療附近菌體、傷害敵人。

unit.necroreject-corrocrust.name=蝕痂
unit.necroreject-corrocrust.description=液爛的重甲變種。不噴射痰液，但分泌更多菌液，並展開一圈菌液光環，腐蝕敵人、回覆同菌體。

bullet.necroreject-corro-secretion.name=濃液分泌
bullet.necroreject-corro-secretion.description=以更高頻率滴下濃厚菌液。
bullet.necroreject-corro-aura.name=腐蝕光環
bullet.necroreject-corro-aura.description=單位周圍一圈脈動光環；敵方持續受到穿甲傷害並被菌蝕，友方菌體緩慢回血。

unit.necroreject-ruptgout.name=崩疽
unit.necroreject-ruptgout.description=重型四足砲兵。蓄力後拋射弧射痰彈，彈體在飛行途中可被擊落。死亡時爆裂並大範圍噴濺菌液。

bullet.necroreject-rupt-lob.name=痰彈迫擊
bullet.necroreject-rupt-lob.description=沿拋物線拋射一發痰彈，可越過牆體。命中時造成中等範圍高爆傷害、大片菌液；蓄力期間自身短暫紮根無法移動。
bullet.necroreject-rupt-secretion.name=菌液分泌
bullet.necroreject-rupt-secretion.description=在腳邊持續分泌菌液。
bullet.necroreject-rupt-death.name=崩裂
bullet.necroreject-rupt-death.description=死亡時劇烈爆裂，在屍體周圍大範圍噴濺菌液。

unit.necroreject-skysunder.name=潰穹
unit.necroreject-skysunder.description=巨型八足攻城平台，背負一門菌生巨砲。緩慢拋射弧形巨型痰彈，造成大範圍高爆與腐蝕，同時在落點裂出數隻液爛。死亡時劇烈爆炸並產生子代菌體。

bullet.necroreject-sky-shell.name=巨型痰彈
bullet.necroreject-sky-shell.description=體積巨大、速度緩慢的弧射砲彈，可被攔截。落點有大範圍高爆飛濺、濃重腐蝕菌液，並裂出 1-2 隻液爛；蓄力時自身短暫紮根。
bullet.necroreject-sky-secretion.name=菌液分泌
bullet.necroreject-sky-secretion.description=在底盤持續滴落菌液。
bullet.necroreject-sky-death-burst.name=災裂
bullet.necroreject-sky-death-burst.description=死亡時巨砲殉爆，產生巨型菌爆。
bullet.necroreject-sky-death-necroflux.name=液爛湧出
bullet.necroreject-sky-death-necroflux.description=爆炸中裂出一隊液爛。
bullet.necroreject-sky-death-corrocrust.name=蝕痂湧出
bullet.necroreject-sky-death-corrocrust.description=偶爾會有一隻蝕痂從殘骸中爬出。

unit.necroreject-rendcrown.name=裂冕
unit.necroreject-rendcrown.description=巨型爬行菌王。展開大範圍腐蝕立場，向四周隨機噴濺菌痰，並週期性醞釀膿疱，爆裂時孵化蝕痂。死亡時綻放出大量菌體軍隊。

bullet.necroreject-rend-field.name=裂冕領域
bullet.necroreject-rend-field.description=頭頂一圈腐蝕立場，對範圍內敵人造成持續穿甲傷害，並按最大生命百分比治療友方菌體。
bullet.necroreject-rend-spray.name=菌痰噴灑
bullet.necroreject-rend-spray.description=向四周隨機噴射數枚菌痰，每枚留下一小片腐蝕菌液。
bullet.necroreject-rend-secretion.name=菌液分泌
bullet.necroreject-rend-secretion.description=持續在自身周圍分泌大片菌液。
bullet.necroreject-rend-pustule.name=膿疱萌出
bullet.necroreject-rend-pustule.description=週期性在身邊萌出一個巨型膿疱，延時爆裂造成飛濺傷害並孵化蝕痂小隊。
bullet.necroreject-rend-death-burst.name=綻放爆轟
bullet.necroreject-rend-death-burst.description=死亡時菌體急劇膨脹後爆裂，毀滅性菌爆覆蓋極大範圍。
bullet.necroreject-rend-death-ruptgout.name=崩疽湧出
bullet.necroreject-rend-death-ruptgout.description=屍肉中可能鑽出一隻崩疽。
bullet.necroreject-rend-death-corrocrust.name=蝕痂湧出
bullet.necroreject-rend-death-corrocrust.description=數隻蝕痂從屍骸中爬出。
bullet.necroreject-rend-death-necroflux.name=液爛蜂擁
bullet.necroreject-rend-death-necroflux.description=大群液爛從菌體中湧出。

status.necroreject-necro-corrosion.name=菌蝕
status.necroreject-necro-corrosion.description=被菌液腐蝕。持續損失最大生命值，移動速度降低，並更容易燃燒。

status.necroreject-necro-rooted.name=紮根
status.necroreject-necro-rooted.description=被菌液壓住，無法移動。
